name: Build & Release ByteLog APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version and Tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ByteLog version=$VERSION (code $CODE), tag=$TAG"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/ByteLog-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ByteLog-${TAG}-debug.apk"
          ls -lh dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ByteLog ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## ⚡ ByteLog ${{ steps.version.outputs.tag }}
            
            *Speed is the feature.*
            
            - **Meal Prep & Batch Cooking**: Log multi-portion batches, scale by servings or cooked grams, and track prepped containers in your Fridge strip with 1-tap logging.
            - **Online Recipe Importer**: Paste recipe URLs or share directly from your browser to extract ingredients, steps, and yields via Schema.org JSON-LD and in-app web fallback.
            - **Interactive Cook Mode**: Step-by-step cooking directions with step checkboxes and automatic cooking timer detection.
            - **Sparky AI Tools**: AI-assisted ingredient parsing and recipe estimation.
            - Built deterministically with consistent release signing for seamless in-place updates.
            
            ### 📱 Downloadable APK:
            Download **`ByteLog-${{ steps.version.outputs.tag }}.apk`** below to install or update directly without uninstalling.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ByteLog-APKs-${{ steps.version.outputs.tag }}
          path: dist/*.apk
          retention-days: 7
