name: Build & Release Nibl APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version and Tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Nibl version=$VERSION (code $CODE), tag=$TAG"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The signing key lives in the repository's secrets, never in the code. Every release must be signed with the
      # same key, or installed copies can't update; so a build that would publish a release fails without it.
      - name: Load Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIBL_KEYSTORE_BASE64 }}
          PUBLISHES: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            if [ "${PUBLISHES}" = "true" ]; then
              echo "::error::The NIBL_KEYSTORE_BASE64 secret isn't set, so this release can't be signed with Nibl's key."
              exit 1
            fi
            echo "No signing key here (a pull request from a fork?): building unsigned."
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "NIBL_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build Signed APKs
        env:
          NIBL_STORE_PASSWORD: ${{ secrets.NIBL_STORE_PASSWORD }}
          NIBL_KEY_ALIAS: ${{ secrets.NIBL_KEY_ALIAS }}
          NIBL_KEY_PASSWORD: ${{ secrets.NIBL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          # Unsigned (no key, not publishing) is named so; a published release is always the signed one
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Nibl-${TAG}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Nibl-${TAG}-unsigned.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Nibl-${TAG}-debug.apk"
          ls -lh dist

      - name: Write Release Notes
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -uo pipefail
          # What changed: the description of the pull request this commit merged (up to its sign-off line)
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].body // ""' > pr_body.md 2>/dev/null || : > pr_body.md
          {
            echo "## Nibl ${TAG}"
            echo
            if [ -s pr_body.md ]; then
              sed -e '/^🤖 Generated with/,$d' pr_body.md
            else
              echo "See the changes listed below."
            fi
            echo
            echo "### 📱 Install"
            echo "Download **\`Nibl-${TAG}.apk\`** below to install, or to update in place without uninstalling."
          } > release_notes.md
          cat release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nibl ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body_path: release_notes.md
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Nibl-APKs-${{ steps.version.outputs.tag }}
          path: dist/*.apk
          retention-days: 7
